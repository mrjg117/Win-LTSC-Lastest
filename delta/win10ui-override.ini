; 本文件只放「不随配置变的红线」，由 99.Force-W10UI-Ini.ps1 在调用 W10UI.cmd 之前写回 W10UI.ini。
; 优化清单不在这里 —— 写进 config.yml 的 optimize.ini，99 会自动把对应键置 1。
; 不整文件覆盖上游 W10UI.ini，只确保这些键的值到位，免疫上游后续加键。
;
; 红线：wim2esd=0 —— 上游那一步必须继续产出 install.wim。
;   ESD 是只读格式，DISM 根本挂不上；一旦上游提前转成 esd，后面 08 会话里的
;   03~07（驱动 / 应用 / 精简 / 断言 / 烤入）就全部挂载失败、构建必挂。
;   转 ESD 改由我们的最后一步 09.Convert-Esd 做（oscdimg 封装之前，wimlib LZMS + solid）。
;
; 已放开的旧红线（2026-09-22 批准，目标「干净且小」）：
;   ResetBase 不再由本文件覆盖 -> 跟随上游 W10UI.ini 的 2（build ≥ 26052 在每个 LCU
;   之后 rebase；其余平台走 Cleanup=1 时的一次 /ResetBase）。代价是被取代的组件不再
;   可卸载、且更耗时；换来 WinSxS 更干净、成品更小。
[Options]
wim2esd=0
