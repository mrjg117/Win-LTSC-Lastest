name: Probe egress (ISO file URLs on reachable hosts)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: HEAD-check actual ISO file URLs (follow redirects)
        run: |
          urls=(
            "https://massgrave.dev/zh-cn_windows_11_enterprise_ltsc_2024_x64_dvd_cff9cd2d.iso"
            "https://massgrave.dev/zh-cn_windows_10_enterprise_ltsc_2021_x64_dvd_033b7312.iso"
          )
          for u in "${urls[@]}"; do
            echo "=== $u ==="
            curl -sIL --max-time 40 "$u" \
              -o /dev/null \
              -w 'final_code=%{http_code} effective_url=%{url_effective} size=%{size_download} content_type=%{content_type}\n' \
              || echo "CURL_ERR"
          done
