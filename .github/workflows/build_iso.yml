name: Build ISO

# 构建对象与份数完全由 config.yml 的 baseline.sources 决定（本文件不重复任何地址/哈希）。
#   plan 任务解析清单 -> 输出矩阵 -> build 任务按矩阵并行构建。
#   清单加一条（且该分支在 patchlist.json 有定义），产物就会自动多一份。

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "上传到仓库 Release"
        type: boolean
        default: true
      upload_r2:
        description: "上传到 Cloudflare R2"
        type: boolean
        default: false
      upload_onedrive:
        description: "上传到 OneDrive"
        type: boolean
        default: false
      keep_release:
        description: "Release 保留版本数"
        type: number
        default: 3
      keep_r2:
        description: "R2 保留版本数"
        type: number
        default: 1
      keep_onedrive:
        description: "OneDrive 保留版本数"
        type: number
        default: 2
  repository_dispatch:
    types: [build-by-update]
  schedule:
    # 每月第3周三 02:00 UTC 兜底（运行前查本月是否已构建，已构建则跳过，避免与事件驱动重复）
    - cron: "0 2 15-21 * 3"

permissions:
  contents: write

jobs:
  # 份数真相源 = config.yml 的 baseline.sources（一行一条）。此任务只解析清单 + 关联 patchlist 分支。
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - name: Checkout（config.yml + patchlist.json）
        uses: actions/checkout@v4

      - name: 解析 baseline.sources -> 构建矩阵
        id: p
        shell: bash
        run: |
          set -euo pipefail

          # 解析 config.yml 的 baseline.sources -> TSV：branch<TAB>url<TAB>sha256
          # （文件名取 URL 末段 = 微软原版名；分片名/merge.cmd 键/成品名都从它派生）
          ROWS="$(awk '
            /^[a-zA-Z]/ { inb = ($1 == "baseline:") }
            inb && /- branch:/ { if (b != "") print b "\t" u "\t" s; b = $3; u = ""; s = "" }
            inb && /^[[:space:]]+url:/    { u = $2 }
            inb && /^[[:space:]]+sha256:/ { s = $2 }
            END { if (b != "") print b "\t" u "\t" s }
          ' config.yml)"
          if [ -z "$ROWS" ]; then
            echo "::error::config.yml 的 baseline.sources 为空或无法解析"
            exit 1
          fi

          MATRIX="["
          SEP=""
          while IFS=$'\t' read -r BR URL SHA; do
            [ -z "$URL" ] && continue
            BR="$(printf '%s' "$BR" | tr -d '"')"
            URL="$(printf '%s' "$URL" | tr -d '"')"
            SHA="$(printf '%s' "$SHA" | tr -d '"' | tr 'a-f' 'A-F')"
            ISO="$(basename "$URL")"
            # 该分支必须在 patchlist.json 有定义（构建引擎按分支取 build/sku/lean）
            LABEL="$(python3 -c "import json,sys;d=json.load(open('patchlist.json',encoding='utf-8-sig'));print(d.get('branches',{}).get(sys.argv[1],{}).get('label',''))" "$BR")"
            if [ -z "$LABEL" ]; then
              echo "::warning::baseline.sources 的分支 $BR 在 patchlist.json 无定义，已跳过（要构建请先补分支定义）"
              continue
            fi
            VER="$(printf '%s' "$LABEL" | grep -oiP 'win\K[0-9]+' | head -1)"
            EDITION="Win${VER}"
            MATRIX="${MATRIX}${SEP}{\"branch\":\"${BR}\",\"edition\":\"${EDITION}\",\"iso\":\"${ISO}\",\"sha256\":\"${SHA}\"}"
            SEP=","
          done <<< "$ROWS"
          MATRIX="${MATRIX}]"

          if [ "$MATRIX" = "[]" ]; then
            echo "::error::没有任何可构建项（清单里的分支都没有 patchlist.json 定义）"
            exit 1
          fi
          echo "构建矩阵: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BRANCH: ${{ matrix.branch }}
      EDITION: ${{ matrix.edition }}
      SRC_ISO: ${{ matrix.iso }}
      SRC_SHA256: ${{ matrix.sha256 }}
      DO_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload_release) || (github.event_name == 'repository_dispatch' && github.event.client_payload.upload_release) || true }}
      DO_R2: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload_r2) || (github.event_name == 'repository_dispatch' && github.event.client_payload.upload_r2) || false }}
      DO_ONEDRIVE: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload_onedrive) || (github.event_name == 'repository_dispatch' && github.event.client_payload.upload_onedrive) || false }}
      KEEP_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.keep_release) || (github.event_name == 'repository_dispatch' && github.event.client_payload.keep_release) || 3 }}
      KEEP_R2: ${{ (github.event_name == 'workflow_dispatch' && inputs.keep_r2) || (github.event_name == 'repository_dispatch' && github.event.client_payload.keep_r2) || 1 }}
      KEEP_ONEDRIVE: ${{ (github.event_name == 'workflow_dispatch' && inputs.keep_onedrive) || (github.event_name == 'repository_dispatch' && github.event.client_payload.keep_onedrive) || 2 }}

    steps:
      - name: Checkout 本仓库（delta + 配置 + 工作流）
        uses: actions/checkout@v4
        with:
          path: self

      - name: 拉上游最新 master（只读，不写）
        shell: bash
        run: |
          git clone --depth 1 https://github.com/adavak/Win_ISO_Patching_Scripts.git src
          echo "UPSTREAM_COMMIT=$(cd src && git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 套 delta 到上游快照（删 update-meta4.yml）
        shell: bash
        run: |
          cp -r self/delta/* src/
          # 根级配置文件也要进 src：delta/lib/*.ps1 是按 $WorkDir(=src) 读取的
          cp -f self/patchlist.json src/patchlist.json || true
          cp -f self/config.yml src/config.yml || true
          cp -f self/merge.cmd src/merge.cmd || true
          rm -f src/.github/workflows/update-meta4.yml || true
          echo "--- src 顶层文件 ---"
          ls -1 src/

      - name: cron 去重（仅每月兜底，本月已构建则跳过）
        if: github.event_name == 'schedule'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $edition = $env:EDITION
          $ym = Get-Date -Format yyMM
          $raw = @(gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName')
          foreach ($t in $raw) {
            if ($t -match "^(\d{2})(\d{2})\d{2}-\d+-$edition$") {
              $p = "$($matches[1])$($matches[2])"
              if ($p -eq $ym) {
                echo "SKIP=1" >> "$env:GITHUB_ENV"
                echo "本月已有 $t 构建，跳过"
                break
              }
            }
          }

      - name: 从 baseline Release 拉 RAW 分块 -> copy/b 重组 -> SHA256 校验
        if: env.SKIP != '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $isoName = $env:SRC_ISO
          $expected = $env:SRC_SHA256
          Write-Host "源镜像: $isoName"
          if ([string]::IsNullOrWhiteSpace($isoName) -or [string]::IsNullOrWhiteSpace($expected)) {
            throw "矩阵缺少 iso / sha256（检查 config.yml 的 baseline.sources）"
          }
          New-Item -ItemType Directory -Force -Path chunks | Out-Null
          gh release download baseline --repo "${{ github.repository }}" --dir chunks --pattern "*$isoName.part*"
          # 按 .part 后的数字排序，顺序字节拼回（与切分严格互逆，等同 copy /b）
          $parts = @(Get-ChildItem chunks -Filter "$isoName.part*" | Sort-Object { [int]($_.Name -replace '.*\.part', '') })
          if ($parts.Count -eq 0) { throw "未找到 baseline 分块（请先运行 Fetch Baseline ISO）" }
          $fs = [System.IO.File]::Create("baseline_out.iso")
          try {
            foreach ($p in $parts) {
              $in = [System.IO.File]::OpenRead($p.FullName)
              try { $in.CopyTo($fs) } finally { $in.Close() }
            }
          } finally { $fs.Close() }
          $iso = Get-Item "baseline_out.iso"
          if (-not $iso) { throw "RAW 重组未产出 ISO" }
          Move-Item $iso.FullName "src\baseline-$($env:BRANCH).iso" -Force
          $actual = (Get-FileHash "src\baseline-$($env:BRANCH).iso" -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "baseline SHA256 不符! 期望 $expected 实际 $actual" }
          Write-Host "baseline SHA256 OK: $actual"
          # 释放磁盘：分块与重组目录已无用（runner D: 仅约 14GB）
          Remove-Item chunks, baseline_out.iso -Recurse -Force -ErrorAction SilentlyContinue

      - name: 运行 Patch.cmd（A→B→W10UI→E→D）
        if: env.SKIP != '1'
        shell: cmd
        run: |
          cd src
          Patch.cmd ${{ matrix.branch }}

      - name: 读取 UBR -> 计算 TAG / ISO_BASE / 生成 Release（manifest/logs）
        if: env.SKIP != '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $m = Get-Content src/manifest.json | ConvertFrom-Json
          $ubr = $m.targetUBR
          $date = Get-Date -Format yyMMdd
          $edition = $env:EDITION
          $tag = "$date-$ubr-$edition"
          # 产出名 = 源镜像名去掉 _dvd_<8hex> 尾巴，换成 _<日期>_<UBR>（不另立命名表）
          $stem = $env:SRC_ISO -replace '_dvd_[0-9a-fA-F]+\.iso$', ''
          if ($stem -eq $env:SRC_ISO) { $stem = $env:SRC_ISO -replace '\.iso$', '' }
          $isoBase = "${stem}_${date}_${ubr}"
          echo "TAG=$tag" >> $env:GITHUB_ENV
          echo "ISO_BASE=$isoBase" >> $env:GITHUB_ENV
          echo "DATE=$date" >> $env:GITHUB_ENV
          echo "UBR=$ubr" >> $env:GITHUB_ENV
          Write-Host "TAG=$tag  ISO_BASE=$isoBase"
          # 释放磁盘：最终 ISO 已封装完，中间 DVD 目录(~5.3GB)不再需要。runner D: 仅约 14GB。
          Remove-Item src/ISO -Recurse -Force -ErrorAction SilentlyContinue
          if ($env:DO_RELEASE -eq 'true') {
            $logs = @(Get-ChildItem src/logs -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
            # 幂等：同月同 UBR 重跑会撞同名 tag（上次的失败运行也留下过空壳 Release），先删再建
            gh release view "$tag" --repo "${{ github.repository }}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "已存在同名 Release $tag -> 删除后重建（幂等重跑）"
              gh release delete "$tag" --repo "${{ github.repository }}" --yes
              gh api --method DELETE "/repos/${{ github.repository }}/git/refs/tags/$tag" 2>$null
            }
            gh release create "$tag" --repo "${{ github.repository }}" --title "$tag" --notes "branch=${{ matrix.branch }} | upstream_commit=$env:UPSTREAM_COMMIT | UBR=$ubr | 源镜像=$env:SRC_ISO" @logs src/manifest.json
          }

      - name: 重命名 + RAW 切分上传 ISO（≤1.9GiB/片，上岸即删）+ 生成 merge.cmd
        if: env.DO_RELEASE == 'true' && env.SKIP != '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # [关键] Patch.cmd 在 src/ 下执行，产物落在 src/out/WinLTSC-<branch>.iso；本步工作目录是仓库根，必须带 src/ 前缀
          $isoPath = "src/out/WinLTSC-${{ matrix.branch }}.iso"
          if (-not (Test-Path $isoPath)) {
            Write-Host "src 下的 out 目录内容："
            Get-ChildItem src/out -Force -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Length) $($_.Name)" }
            throw "最终 ISO 未生成：$isoPath"
          }
          $isoBase = $env:ISO_BASE
          $finalIso = "src/out/$isoBase.iso"
          Move-Item $isoPath $finalIso -Force
          $iso = Get-Item $finalIso
          $size = $iso.Length
          $hash = (Get-FileHash $finalIso -Algorithm SHA256).Hash
          Write-Host "ISO size = $([math]::Round($size/1GB,2)) GB  SHA256=$hash"
          # 逐片生成 -> 上传 -> 立即删除，避免 ISO(7.9GB)+全部分片(~7.9GB) 同时占盘撑爆 runner
          $chunk = 1900L * 1024L * 1024L
          $buf = New-Object byte[] (16777216)
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $idx = 1
          $fs = [System.IO.File]::OpenRead($finalIso)
          try {
            while ($fs.Position -lt $size) {
              $name = "out/$isoBase.iso.part$idx"
              $out = [System.IO.File]::Create($name)
              try {
                $written = 0L
                while ($written -lt $chunk -and $fs.Position -lt $size) {
                  $toRead = [int][Math]::Min([long]$buf.Length, $chunk - $written)
                  $n = $fs.Read($buf, 0, $toRead)
                  if ($n -le 0) { break }
                  $out.Write($buf, 0, $n)
                  $written += $n
                }
              } finally { $out.Close() }
              Write-Host "upload $name ($([math]::Round($written/1MB,1)) MB)"
              $ok = $false
              for ($i = 1; $i -le 3 -and -not $ok; $i++) {
                gh release upload "$env:TAG" $name --repo "${{ github.repository }}" --clobber
                if ($LASTEXITCODE -eq 0) { $ok = $true } else { Write-Host "第 $i 次上传失败，重试…"; Start-Sleep -Seconds 10 }
              }
              if (-not $ok) { throw "分片 $name 上传失败（已重试 3 次）" }
              Remove-Item $name -Force
              $idx++
            }
          } finally { $fs.Close() }
          $count = $idx - 1
          Write-Host "共上传 $count 片"
          $expected = [math]::Ceiling($size / $chunk)
          if ($count -ne $expected) { throw "片数校验失败：期望 $expected 片，实际 $count 片" }
          # 生成 merge.cmd（内嵌本 ISO 期望哈希）并上传
          $tpl = Get-Content self/merge.cmd -Raw
          $expLine = 'set "EXP_' + $isoBase + '.iso=' + $hash.ToUpper() + '"'
          $tpl = $tpl -replace '(?s)(REM ===EXPECTED_HASHES_START===).*?(REM ===EXPECTED_HASHES_END===)', ('$1' + [Environment]::NewLine + $expLine + [Environment]::NewLine + '$2')
          Set-Content -Path "out/merge.cmd" -Value $tpl -NoNewline
          gh release upload "$env:TAG" "out/merge.cmd" --repo "${{ github.repository }}" --clobber
          Remove-Item "out/merge.cmd" -Force
          # 校验 Release 资产数与 part 数一致
          $assets = (gh api "repos/${{ github.repository }}/releases/tags/$env:TAG" | ConvertFrom-Json).assets | Where-Object { $_.name -like "*.part*" }
          Write-Host "Release 上的 part 资产数：$($assets.Count)"
          if ($assets.Count -lt $expected) { throw "Release 资产缺失：期望 $expected 个 part，实际 $($assets.Count) 个" }
          # R2 / OneDrive 通道若开启则需保留 ISO；否则删掉释放磁盘
          if ($env:DO_R2 -ne 'true' -and $env:DO_ONEDRIVE -ne 'true') {
            Remove-Item $finalIso -Force
            Write-Host "已删除本地 ISO，释放 $([math]::Round($size/1GB,2)) GB"
          }

      - name: 安装 rclone（R2 / OneDrive 通道）
        if: (env.DO_R2 == 'true' || env.DO_ONEDRIVE == 'true') && env.SKIP != '1'
        shell: pwsh
        run: |
          Invoke-WebRequest https://downloads.rclone.org/rclone-current-windows-amd64.zip -OutFile rclone.zip
          Expand-Archive rclone.zip -DestinationPath rclone_bin
          $rclone = (Get-ChildItem rclone_bin -Recurse -Filter rclone.exe | Select-Object -First 1).DirectoryName
          echo "$rclone" >> $env:GITHUB_PATH

      - name: 上传 R2（S3 兼容）
        if: env.DO_R2 == 'true' && env.SKIP != '1'
        shell: pwsh
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy "src\out\$env:ISO_BASE.iso" "r2:$env:R2_BUCKET/$env:TAG/"

      - name: 上传 OneDrive
        if: env.DO_ONEDRIVE == 'true' && env.SKIP != '1'
        shell: pwsh
        env:
          ONEDRIVE_RCLONE_CONF_B64: ${{ secrets.ONEDRIVE_RCLONE_CONF }}
        run: |
          $dir = "$env:USERPROFILE\.config\rclone"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [IO.File]::WriteAllBytes("$dir\rclone.conf", [Convert]::FromBase64String($env:ONEDRIVE_RCLONE_CONF_B64))
          rclone copy "src\out\$env:ISO_BASE.iso" "onedrive:WinLTSC/$env:TAG/"

      - name: prune Release（保留 KEEP_RELEASE 个）
        if: env.DO_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ env.KEEP_RELEASE }}
        run: |
          $keep = [int]$env:KEEP
          $edition = $env:EDITION
          # [关键] gh --jq 输出的是"未加引号的纯文本行"，不是 JSON，不能再 ConvertFrom-Json
          $raw = @(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName')
          # 降序=最新在前，Skip $keep 才能删掉"最旧的"、保留"最新的"
          $tags = @($raw | Where-Object { $_ -like "*-$edition" } | Sort-Object -Descending)
          Write-Host "现有 *-$edition 标签：$($tags.Count) 个 -> $($tags -join ', ')"
          $old = @($tags | Select-Object -Skip $keep)
          foreach ($t in $old) {
            gh release delete $t --repo "${{ github.repository }}" --yes
            gh api --method DELETE "/repos/${{ github.repository }}/git/refs/tags/$t" 2>$null
            Write-Host "pruned release $t"
          }

      - name: prune R2（保留 KEEP_R2 个）
        if: env.DO_R2 == 'true'
        shell: pwsh
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KEEP: ${{ env.KEEP_R2 }}
        run: |
          $keep = [int]$env:KEEP
          $edition = $env:EDITION
          $dirs = @(rclone lsd "r2:$env:R2_BUCKET" | ForEach-Object { ($_ -split '\s+')[-1] } | Where-Object { $_ -like "*-$edition" } | Sort-Object -Descending)
          $old = @($dirs | Select-Object -Skip $keep)
          foreach ($d in $old) { rclone purge "r2:$env:R2_BUCKET/$d"; Write-Host "pruned r2 $d" }

      - name: prune OneDrive（保留 KEEP_ONEDRIVE 个）
        if: env.DO_ONEDRIVE == 'true'
        shell: pwsh
        env:
          ONEDRIVE_RCLONE_CONF_B64: ${{ secrets.ONEDRIVE_RCLONE_CONF }}
          KEEP: ${{ env.KEEP_ONEDRIVE }}
        run: |
          $dir = "$env:USERPROFILE\.config\rclone"
          [IO.File]::WriteAllBytes("$dir\rclone.conf", [Convert]::FromBase64String($env:ONEDRIVE_RCLONE_CONF_B64))
          $keep = [int]$env:KEEP
          $edition = $env:EDITION
          $dirs = @(rclone lsd "onedrive:WinLTSC" | ForEach-Object { ($_ -split '\s+')[-1] } | Where-Object { $_ -like "*-$edition" } | Sort-Object -Descending)
          $old = @($dirs | Select-Object -Skip $keep)
          foreach ($d in $old) { rclone purge "onedrive:WinLTSC/$d"; Write-Host "pruned onedrive $d" }
