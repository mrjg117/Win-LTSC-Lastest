name: Build ISO

# 构建对象与份数完全由 config.yml 决定（本文件不重复任何地址/哈希/分支信息）。
#   plan 任务：config.yml -> config.json（唯一控制面板只解析一次；顺带做结构性校验），
#              再据此输出矩阵；config.json 以 artifact 传给 build 任务 ——
#              Windows 侧只读 JSON，不用装 YAML 解析库。
#   build 任务：按矩阵并行构建。清单加一条（且该分支在 branches 里有定义）产物就多一份。
#
# 上游地址是本文件里唯一的 URL 常量：Win_ISO_Patching_Scripts 是**不可替换的唯一依赖**
# （delta 全部挂在它产出的 install.wim 上），所以不适合放进「可随意改」的控制面板误导人。
# 不钉 ref：持续吃上游最新；实际 commit 写进 Release notes 备查。

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "上传到仓库 Release"
        type: boolean
        default: true
      upload_r2:
        description: "上传到 Cloudflare R2"
        type: boolean
        default: false
      upload_onedrive:
        description: "上传到 SharePoint（默认站点默认文档库）"
        type: boolean
        default: false
      keep_release:
        description: "Release 保留版本数"
        type: number
        default: 3
      keep_r2:
        description: "R2 保留版本数"
        type: number
        default: 1
      keep_onedrive:
        description: "SharePoint 保留版本数"
        type: number
        default: 2
      onedrive_path:
        description: "SharePoint 文档库内根文件夹（可含子路径，如 ISO/WinLTSC；留空=文档库根）"
        type: string
        default: WinLTSC
  repository_dispatch:
    types: [build-by-update]
  schedule:
    # 每月第3周三 02:00 UTC 兜底（运行前查本月是否已构建，已构建则跳过，避免与事件驱动重复）
    - cron: "0 2 15-21 * 3"

permissions:
  contents: write

jobs:
  # 份数真相源 = config.yml 的 baseline.sources（一行一条）；分支定义在同一文件的 branches。
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - name: Checkout（config.yml + tools/）
        uses: actions/checkout@v4

      - name: 解析 config.yml -> config.json（唯一控制面板只解析一次，顺带结构性校验）
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/config-to-json.py config.yml config.json

      - name: 生成构建矩阵
        id: p
        run: |
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          out = sys.argv[1]
          cfg = json.load(open("config.json", encoding="utf-8"))
          rows = []
          for s in cfg["baseline"]["sources"]:
              b   = s["branch"]
              ver = re.search(r"win\s*(\d+)", cfg["branches"][b]["label"], re.I).group(1)
              rows.append({
                  "branch":  b,
                  "edition": "Win" + ver,                     # 产物标签后缀的唯一生成点
                  "iso":     s["url"].rsplit("/", 1)[-1],     # 文件名 = URL 末段（契约命名）
                  "sha256":  s["sha256"].upper(),
              })
          m = json.dumps(rows, ensure_ascii=False, separators=(",", ":"))
          print("构建矩阵: " + m)
          with open(out, "a", encoding="utf-8") as f:
              f.write("matrix=" + m + "\n")
          PY

      - name: 上传 config.json（供 build 任务读取）
        uses: actions/upload-artifact@v4
        with:
          name: config-json
          path: config.json
          retention-days: 1

  build:
    needs: plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BRANCH: ${{ matrix.branch }}
      EDITION: ${{ matrix.edition }}
      SRC_ISO: ${{ matrix.iso }}
      SRC_SHA256: ${{ matrix.sha256 }}
      DO_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload_release) || (github.event_name == 'repository_dispatch' && github.event.client_payload.upload_release) || true }}
      DO_R2: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload_r2) || (github.event_name == 'repository_dispatch' && github.event.client_payload.upload_r2) || false }}
      DO_ONEDRIVE: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload_onedrive) || (github.event_name == 'repository_dispatch' && github.event.client_payload.upload_onedrive) || false }}
      KEEP_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.keep_release) || (github.event_name == 'repository_dispatch' && github.event.client_payload.keep_release) || 3 }}
      KEEP_R2: ${{ (github.event_name == 'workflow_dispatch' && inputs.keep_r2) || (github.event_name == 'repository_dispatch' && github.event.client_payload.keep_r2) || 1 }}
      KEEP_ONEDRIVE: ${{ (github.event_name == 'workflow_dispatch' && inputs.keep_onedrive) || (github.event_name == 'repository_dispatch' && github.event.client_payload.keep_onedrive) || 2 }}
      OD_PATH: ${{ (github.event_name == 'workflow_dispatch' && inputs.onedrive_path) || (github.event_name == 'repository_dispatch' && github.event.client_payload.onedrive_path) || 'WinLTSC' }}

    steps:
      - name: Checkout 本仓库（delta + 配置 + tools）
        uses: actions/checkout@v4
        with:
          path: self

      - name: 准备 Python（抓取载荷用）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 取回 config.json（plan 任务产出；Linux 侧已解析并校验过）
        uses: actions/download-artifact@v4
        with:
          name: config-json
          path: self

      - name: 拉上游最新 master（只读，不写）
        shell: bash
        run: |
          # 唯一上游依赖，不可替换：delta 全部挂在它产出的 install.wim 上。
          # 不钉 ref —— 持续吃上游最新；实际 commit 记进 Release notes。
          UPSTREAM_URL="https://github.com/adavak/Win_ISO_Patching_Scripts.git"
          # --progress：git 默认只在终端里刷进度；CI 的 stdout 是管道，不加这个开关
          #   就一个字节都不打（实测该步真实输出只有那行 `Cloning into 'src'...`）。
          git clone --depth 1 --progress "$UPSTREAM_URL" src
          UPSTREAM_COMMIT=$(cd src && git rev-parse HEAD)
          echo "UPSTREAM_COMMIT=$UPSTREAM_COMMIT" >> "$GITHUB_ENV"
          echo "上游 commit: $UPSTREAM_COMMIT"

      - name: 套 delta 到上游快照（删 update-meta4.yml）
        shell: bash
        run: |
          # -v：把每个被拷入/覆盖的文件名逐条打出来 —— 命令窗里能看清我们把上游哪些文件换掉了
          cp -rv self/delta/* src/
          # 根级配置要进 src：delta/lib/*.ps1 都是按 -WorkDir(=%cd%=src) 读取的
          cp -fv self/config.json src/config.json
          rm -f src/.github/workflows/update-meta4.yml || true
          echo "--- src 顶层文件 ---"
          ls -1 src/

      - name: 抓取载荷（按 config 声明的 components + apps）
        # Git Bash 下 python 可用：actions/setup-python 会把 Windows 版 python.exe 注入 PATH，
        #   runner 日志实测（run 35670241524）该 step 能正常下载组件，直到脚本自身抛错。
        #   注意：bash 分支参数要带引号 —— Git Bash 会把裸值当字符串拼，${{ }} 在此足够。
        shell: bash
        run: |
          # 载荷落进 src/assets/{redist,apps}，正是 delta 脚本读取的位置
          export PYTHONUNBUFFERED=1   # 让 python 的 log 即时刷到 Actions 日志，不被缓冲到结束才显示
          python self/tools/fetch-payloads.py --config self/config.json --dest src --branch "${{ matrix.branch }}"

      - name: cron 去重（仅每月兜底，本月已构建则跳过）
        if: github.event_name == 'schedule'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $edition = $env:EDITION
          $ym = Get-Date -Format yyMM
          $raw = @(gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName')
          foreach ($t in $raw) {
            if ($t -match "^(\d{2})(\d{2})\d{2}-\d+-$edition$") {
              $p = "$($matches[1])$($matches[2])"
              if ($p -eq $ym) {
                echo "SKIP=1" >> "$env:GITHUB_ENV"
                echo "本月已有 $t 构建，跳过"
                break
              }
            }
          }

      - name: 从 baseline Release 拉 RAW 分块 -> copy/b 重组 -> SHA256 校验
        if: env.SKIP != '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $isoName = $env:SRC_ISO
          $expected = $env:SRC_SHA256
          $repo = "${{ github.repository }}"
          Write-Host "源镜像: $isoName"
          if ([string]::IsNullOrWhiteSpace($isoName) -or [string]::IsNullOrWhiteSpace($expected)) {
            throw "矩阵缺少 iso / sha256（检查 config.yml 的 baseline.sources）"
          }
          New-Item -ItemType Directory -Force -Path chunks | Out-Null

          # ── ① 分块清单：先把「要下什么、多大」如实打出来
          # gh 在非终端里一个字节都不打（进度条只在真终端渲染），所以由我们把清单打出来。
          # 用 gh api 取 assets 而不是 ls 本地目录：这样"清单"来自 Release 的事实，不是猜的。
          $release = gh api "repos/$repo/releases/tags/baseline" | ConvertFrom-Json
          $assets  = @($release.assets | Where-Object { $_.name -like "$isoName.part*" } |
                       Sort-Object { [int]($_.name -replace '.*\.part', '') })
          if ($assets.Count -eq 0) { throw "未找到 baseline 分块（请先运行 Fetch Baseline ISO）" }
          $sum = ($assets | Measure-Object -Property size -Sum).Sum
          Write-Host ("baseline 分块清单（{0} 块，合计 {1:N2} GB）：" -f $assets.Count, ($sum / 1GB))
          foreach ($a in $assets) { Write-Host ("  {0}  {1:N1} MB" -f $a.name, ($a.size / 1MB)) }

          # ── ② 逐块下载：每块下完打「实测大小 + 真实耗时」——下载全程是看得见的
          $i = 0
          foreach ($a in $assets) {
            $i++
            $t0 = Get-Date
            gh release download baseline --repo $repo --dir chunks --pattern $a.name
            if ($LASTEXITCODE -ne 0) { throw "分块下载失败: $($a.name)" }
            $got  = Get-Item (Join-Path chunks $a.name)
            $secs = ((Get-Date) - $t0).TotalSeconds
            Write-Host ("  [{0}/{1}] {2}  实测 {3:N1} MB  用时 {4:N1}s" -f $i, $assets.Count, $a.name, ($got.Length / 1MB), $secs)
          }

          # ── ③ 按 .part 后的数字排序，顺序字节拼回（与切分严格互逆，等同 copy /b）
          $parts = @(Get-ChildItem chunks -Filter "$isoName.part*" | Sort-Object { [int]($_.Name -replace '.*\.part', '') })
          $total = ($parts | Measure-Object -Property Length -Sum).Sum
          Write-Host ("开始按序拼接 {0} 块 -> baseline_out.iso（合计 {1:N2} GB）" -f $parts.Count, ($total / 1GB))
          $fs = [System.IO.File]::Create("baseline_out.iso")
          try {
            foreach ($p in $parts) {
              $in = [System.IO.File]::OpenRead($p.FullName)
              try { $in.CopyTo($fs) } finally { $in.Close() }
              Write-Host ("  + {0}  {1:N1} MB" -f $p.Name, ($p.Length / 1MB))
            }
          } finally { $fs.Close() }
          $iso = Get-Item "baseline_out.iso"
          if (-not $iso) { throw "RAW 重组未产出 ISO" }
          Write-Host ("拼接完成: {0}  {1:N2} GB" -f $iso.Name, ($iso.Length / 1GB))
          Move-Item $iso.FullName "src\baseline-$($env:BRANCH).iso" -Force

          # ── ④ SHA256：5GB 要跑十几秒，进前先报一声，别让人以为卡住
          $dst = "src\baseline-$($env:BRANCH).iso"
          Write-Host ("SHA256 计算中：{0}（{1:N2} GB）…" -f (Split-Path $dst -Leaf), ((Get-Item $dst).Length / 1GB))
          $t0 = Get-Date
          $actual = (Get-FileHash $dst -Algorithm SHA256).Hash
          $secs = ((Get-Date) - $t0).TotalSeconds
          if ($actual -ne $expected) { throw "baseline SHA256 不符! 期望 $expected 实际 $actual" }
          Write-Host ("baseline SHA256 OK: {0}（用时 {1:N1}s）" -f $actual, $secs)

          # 释放磁盘：分块与重组目录已无用
          Remove-Item chunks, baseline_out.iso -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host ("已清理分块与临时文件，释放 {0:N2} GB" -f ($total / 1GB))

      - name: 运行 Patch.cmd（A→B→W10UI→单次挂载会话→转 ESD→D）
        # 此步最耗时（20~40min）。目标：**web 日志 = 真机命令窗的内容，一行不多、一行不少**。
        # [机制] Patch.cmd 自身不做任何重定向（本地双击运行时命令窗里是什么就是什么）；
        #   由本步父进程接管 `cmd /c "chcp 65001 & Patch.cmd <branch> > logs\Patch.log 2>&1"`，
        #   再用常开的 StreamReader 增量跟随该文件，把它**原样**写到 step 输出 ——
        #   于是「本地命令窗 == src\logs\Patch.log == web 日志」三者同一份字节。
        #   ⚠ 不要改回在 Patch.cmd 内部重定向（那会让命令窗彻底空白，历史踩过）。
        #   ⚠ **不要在本步加入任何自己的输出**（心跳 / 计数 / 分隔线 / 启动提示）—— 那属于
        #     "不属于命令窗的内容"，会被一眼看出是假进度。诊断信息一律走失败时的 annotation。
        # [坑①·实测复现] 重定向路径按「执行那一刻的当前目录」解析：写 `cd src && ... > src\x.log`
        #   会把 `src\` 再拼一层（= src\src\x.log，目录不存在）→ cmd 报
        #   "The system cannot find the path specified."、退出码 1，Patch.cmd 一个字符都不跑。
        #   故**不 cd**，用 `working-directory: src` + ProcessStartInfo.WorkingDirectory 指定工作目录，
        #   重定向写相对路径 `logs\Patch.log`（相对 src 解析，正好落在 src\logs\Patch.log）。
        # [坑②] 重定向目标所在目录必须**先存在**：cmd 在启动那一刻就会打开文件，目录不在即秒退。
        #   故先 mkdir logs（Patch.cmd 自己也建，双保险）。
        # [编码] 父进程先 chcp 65001：Patch.cmd 是 UTF-8 文件、含中文 echo，输出码页不设成
        #   65001 会整片乱码。上游 W10UI.cmd 实测纯 ASCII，不受影响。
        #   ⚠ 不要在 Patch.cmd 里 chcp（批处理中途改码页会让 cmd 行偏移错位，已知会跳行）。
        if: env.SKIP != '1'
        shell: pwsh
        working-directory: src
        run: |
          chcp 65001 > $null
          try { [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false) } catch {}

          New-Item -ItemType Directory -Force -Path "logs" | Out-Null
          $patchlog = "logs\Patch.log"
          Remove-Item $patchlog -Force -ErrorAction SilentlyContinue
          $wd = (Get-Location).Path
          if (-not (Test-Path (Join-Path $wd "Patch.cmd"))) {
            throw "找不到上游快照里的 Patch.cmd: $wd（前面的『套 delta 到上游快照』步是否成功？）"
          }

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "cmd.exe"
          # 父进程统一重定向：本地命令窗与 CI 的 Patch.log 拿到的是同一份字节。
          # 先在本条命令行里 chcp 65001（不是写进 Patch.cmd！见上面的编码说明）——
          # 这样 cmd 进程自身及其所有子进程都按 UTF-8 输出，批处理里的中文 echo 才不乱码。
          $psi.Arguments = "/c chcp 65001 >nul & Patch.cmd $env:BRANCH > $patchlog 2>&1"
          $psi.UseShellExecute = $false
          $psi.WorkingDirectory = $wd
          $p = [System.Diagnostics.Process]::Start($psi)

          $reader   = $null
          $pending  = ""                      # 尚未以 \n 结束的尾巴（原地刷新的进度条会落在这里）
          $progLast = $null                   # 最近一条「进度条」，只保留最后一条
          $chunk    = New-Object char[] 65536
          $ansi     = [string][char]27

          # 进度条行判定：`[==== 55.0% ====]` / `[=== 96.5%====]` 这类（等号在左或在右都认）。
          function Test-ProgressLine([string]$s) {
            return ($s -match '^\s*\[[=*\s]*\d{1,3}(\.\d+)?%[=*\s]*\]\s*$')
          }

          # 把命令窗的内容原样打出去。这里只做**终端语义还原**，不做内容加工：
          #   · 行内残留的 \r = 终端「原地覆盖重写」，只留覆盖后的那一段（DISM/W10UI 进度条就这么刷）
          #   · 纯进度条行只打最后一条 —— 真机命令窗从始至终也只显示那一行
          #   · 剥掉 ANSI 转义序列
          # 除此之外**一个字都不加**：没有心跳、没有计数、没有分隔线。
          function Flush-Lines {
            while (($i = $script:pending.IndexOf("`n")) -ge 0) {
              $line = $script:pending.Substring(0, $i)
              $script:pending = $script:pending.Substring($i + 1)
              $line = ($line.TrimEnd("`r")) -replace ($ansi + "\[[0-9;?]*[A-Za-z]"), ""
              if ($line.IndexOf("`r") -ge 0) { $line = ($line -split "`r")[-1] }
              if ($line.Trim().Length -eq 0) { continue }
              if (Test-ProgressLine $line) { $script:progLast = $line.Trim(); continue }
              if ($script:progLast) { Write-Host $script:progLast; $script:progLast = $null }
              Write-Host $line
            }
            # 极端情况兜底：只有进度条、长时间不换行时别让 pending 无限膨胀
            if ($script:pending.Length -gt 4000) {
              $script:pending = $script:pending.Substring($script:pending.Length - 4000)
            }
          }

          # 1s 一轮：越短越"同步"；开销可忽略（只读文件尾的新增字节）
          try {
            while (-not $p.HasExited) {
              Start-Sleep -Seconds 1
              # 日志文件由 cmd 在启动时创建，出现后再打开并保持（FileShare.ReadWrite 允许边写边读）
              if ($null -eq $reader -and (Test-Path $patchlog)) {
                try {
                  $fs = [System.IO.File]::Open($patchlog, [System.IO.FileMode]::Open,
                        [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
                  $reader = New-Object System.IO.StreamReader($fs)
                } catch { $reader = $null }
              }
              if ($reader) {
                while (($n = $reader.Read($chunk, 0, $chunk.Length)) -gt 0) {
                  $pending += (-join $chunk[0..($n - 1)])
                }
                Flush-Lines
              }
            }
          } finally { if ($reader) { $reader.Dispose() } }

          if ($null -eq $reader) {
            throw "无法打开 $patchlog（cmd 秒退 / 重定向目录不存在？）—— 检查 Patch.cmd 与 logs 目录"
          }
          # 进程可能在上一次轮询之内就结束了：退出后把剩余缓冲收尾读完
          try {
            while (($n = $reader.Read($chunk, 0, $chunk.Length)) -gt 0) { $pending += (-join $chunk[0..($n - 1)]) }
          } catch {}
          Flush-Lines
          if ($progLast) { Write-Host $progLast; $progLast = $null }

          if ($p.ExitCode -ne 0) {
            # 全步唯一一处「非命令窗内容」，且只在**失败时**出现：把失败现场写进 annotation。
            # annotation 走 check-runs API，**无需登录/令牌即可读**（原始 job 日志必须认证，匿名 403）。
            # 转义规则（GitHub workflow command 约定）：行内 % -> %25，行间换行 -> %0A。
            $tail = @()
            if (Test-Path $patchlog) { $tail = @(Get-Content $patchlog -Tail 25 -ErrorAction SilentlyContinue) }
            $msg  = ($tail | ForEach-Object { ($_ -replace '%','%25').TrimEnd() }) -join '%0A'
            if ($msg.Length -gt 3800) { $msg = $msg.Substring($msg.Length - 3800) }
            Write-Host ("::error title=Patch.cmd failed exit=" + $p.ExitCode + "::" + $msg)
            throw "Patch.cmd 退出码 $($p.ExitCode)"
          }

      - name: 保留 Patch 日志（失败/取消时上传，便于离线排查）
        # 该步与本 job 其它步骤相互独立：只在前面失败/取消时执行。
        # src\logs\ 里是 Patch.cmd + 各 lib\*.ps1 的完整日志；runner 销毁后只此一份。
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: patch-logs-branch${{ matrix.branch }}
          path: src/logs/
          if-no-files-found: ignore
          retention-days: 3

      - name: 读取 UBR -> 计算 TAG / ISO_BASE / 生成 Release（manifest/logs）
        if: env.SKIP != '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $m = Get-Content src/manifest.json | ConvertFrom-Json
          $ubr = $m.targetUBR
          $date = Get-Date -Format yyMMdd
          $edition = $env:EDITION
          $tag = "$date-$ubr-$edition"
          # 产出名 = 源镜像名去掉 _dvd_<8hex> 尾巴，换成 _<日期>_<UBR>（不另立命名表）
          $stem = $env:SRC_ISO -replace '_dvd_[0-9a-fA-F]+\.iso$', ''
          if ($stem -eq $env:SRC_ISO) { $stem = $env:SRC_ISO -replace '\.iso$', '' }
          $isoBase = "${stem}_${date}_${ubr}"
          echo "TAG=$tag" >> $env:GITHUB_ENV
          echo "ISO_BASE=$isoBase" >> $env:GITHUB_ENV
          echo "DATE=$date" >> $env:GITHUB_ENV
          echo "UBR=$ubr" >> $env:GITHUB_ENV
          Write-Host "manifest 目标 UBR: $ubr"
          Write-Host "TAG=$tag  ISO_BASE=$isoBase"
          # 释放磁盘：最终 ISO 已封装完，中间 DVD 目录不再需要（W10UI 产出的封装 ISO + 解开的分布文件夹）
          if (Test-Path src/ISO) {
            $gb = [math]::Round((Get-ChildItem src/ISO -Recurse -File -ErrorAction SilentlyContinue |
                                 Measure-Object -Property Length -Sum).Sum / 1GB, 2)
            Remove-Item src/ISO -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "已删除中间目录 src/ISO，释放 $gb GB"
          }
          if ($env:DO_RELEASE -eq 'true') {
            $logs = @(Get-ChildItem src/logs -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
            Write-Host "Release 附件清单（$($logs.Count) 个日志 + manifest.json）："
            foreach ($l in $logs) { Write-Host ("  {0}  {1:N0} B" -f (Split-Path $l -Leaf), (Get-Item $l).Length) }
            Write-Host ("  manifest.json  {0:N0} B" -f (Get-Item src/manifest.json).Length)
            # 幂等：同月同 UBR 重跑会撞同名 tag（上次的失败运行也留下过空壳 Release），先删再建
            gh release view "$tag" --repo $repo 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "已存在同名 Release $tag -> 删除后重建（幂等重跑）"
              gh release delete "$tag" --repo $repo --yes
              gh api --method DELETE "/repos/$repo/git/refs/tags/$tag" 2>$null
            } else {
              Write-Host "无同名 Release，直接创建 $tag"
            }
            gh release create "$tag" --repo $repo --title "$tag" --notes "branch=${{ matrix.branch }} | upstream_commit=$env:UPSTREAM_COMMIT | UBR=$ubr | 源镜像=$env:SRC_ISO" @logs src/manifest.json
            if ($LASTEXITCODE -ne 0) { throw "Release 创建失败: $tag" }
            Write-Host "Release $tag 已创建: $(gh release view "$tag" --repo $repo --json url --jq .url)"
          }

      - name: 重命名 + RAW 切分上传 ISO（≤1.9GiB/片，上岸即删）+ 生成 merge.cmd
        if: env.DO_RELEASE == 'true' && env.SKIP != '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          # [关键] Patch.cmd 在 src/ 下执行，产物落在 src/out/WinLTSC-<branch>.iso；本步工作目录是仓库根，必须带 src/ 前缀
          $isoPath = "src/out/WinLTSC-${{ matrix.branch }}.iso"
          if (-not (Test-Path $isoPath)) {
            Write-Host "src 下的 out 目录内容："
            Get-ChildItem src/out -Force -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Length) $($_.Name)" }
            throw "最终 ISO 未生成：$isoPath"
          }
          $isoBase = $env:ISO_BASE
          $finalIso = "src/out/$isoBase.iso"
          Move-Item $isoPath $finalIso -Force
          $iso = Get-Item $finalIso
          $size = $iso.Length
          Write-Host ("最终 ISO: {0}  {1:N2} GB（{2:N0} 字节）" -f $iso.Name, ($size / 1GB), $size)
          Write-Host ("SHA256 计算中（{0:N2} GB）…" -f ($size / 1GB))
          $t0 = Get-Date
          $hash = (Get-FileHash $finalIso -Algorithm SHA256).Hash
          Write-Host ("ISO SHA256 = {0}（用时 {1:N1}s）" -f $hash, ((Get-Date) - $t0).TotalSeconds)
          # 逐片生成 -> 上传 -> 立即删除，避免 ISO(7.9GB)+全部分片(~7.9GB) 同时占盘撑爆 runner
          $chunk = 1900L * 1024L * 1024L
          Write-Host ("按 {0:N0} MB/片切分，预计 {1} 片" -f ($chunk / 1MB), [math]::Ceiling($size / $chunk))
          $buf = New-Object byte[] (16777216)
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $idx = 1
          $fs = [System.IO.File]::OpenRead($finalIso)
          try {
            while ($fs.Position -lt $size) {
              $name = "out/$isoBase.iso.part$idx"
              $t0 = Get-Date
              $out = [System.IO.File]::Create($name)
              try {
                $written = 0L
                while ($written -lt $chunk -and $fs.Position -lt $size) {
                  $toRead = [int][Math]::Min([long]$buf.Length, $chunk - $written)
                  $n = $fs.Read($buf, 0, $toRead)
                  if ($n -le 0) { break }
                  $out.Write($buf, 0, $n)
                  $written += $n
                }
              } finally { $out.Close() }
              Write-Host ("upload {0}（{1:N1} MB，切片用时 {2:N1}s）" -f $name, ($written / 1MB), ((Get-Date) - $t0).TotalSeconds)
              $t0 = Get-Date
              $ok = $false
              for ($i = 1; $i -le 3 -and -not $ok; $i++) {
                gh release upload "$env:TAG" $name --repo $repo --clobber
                if ($LASTEXITCODE -eq 0) { $ok = $true } else { Write-Host "第 $i 次上传失败，重试…"; Start-Sleep -Seconds 10 }
              }
              if (-not $ok) { throw "分片 $name 上传失败（已重试 3 次）" }
              Write-Host ("  -> {0} 上传完成，用时 {1:N1}s" -f (Split-Path $name -Leaf), ((Get-Date) - $t0).TotalSeconds)
              Remove-Item $name -Force
              $idx++
            }
          } finally { $fs.Close() }
          $count = $idx - 1
          Write-Host "共上传 $count 片"
          $expected = [math]::Ceiling($size / $chunk)
          if ($count -ne $expected) { throw "片数校验失败：期望 $expected 片，实际 $count 片" }
          # 生成 merge.cmd（内嵌本 ISO 期望哈希）并上传
          $tpl = Get-Content self/assets/release/merge.cmd -Raw
          $expLine = 'set "EXP_' + $isoBase + '.iso=' + $hash.ToUpper() + '"'
          Write-Host "merge.cmd 内嵌期望哈希行：$expLine"
          $tpl = $tpl -replace '(?s)(REM ===EXPECTED_HASHES_START===).*?(REM ===EXPECTED_HASHES_END===)', ('$1' + [Environment]::NewLine + $expLine + [Environment]::NewLine + '$2')
          Set-Content -Path "out/merge.cmd" -Value $tpl -NoNewline
          gh release upload "$env:TAG" "out/merge.cmd" --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "merge.cmd 上传失败" }
          Write-Host ("  -> merge.cmd 上传完成（{0:N0} 字节）" -f (Get-Item "out/merge.cmd").Length)
          Remove-Item "out/merge.cmd" -Force
          # 校验 Release 资产数与 part 数一致
          $assets = (gh api "repos/$repo/releases/tags/$env:TAG" | ConvertFrom-Json).assets | Where-Object { $_.name -like "*.part*" }
          Write-Host "Release 上的 part 资产数：$($assets.Count)（期望 $expected）"
          if ($assets.Count -lt $expected) { throw "Release 资产缺失：期望 $expected 个 part，实际 $($assets.Count) 个" }
          Write-Host "Release URL: $(gh release view "$env:TAG" --repo $repo --json url --jq .url)"
          # R2 / SharePoint 通道若开启则需保留 ISO；否则删掉释放磁盘
          if ($env:DO_R2 -ne 'true' -and $env:DO_ONEDRIVE -ne 'true') {
            Remove-Item $finalIso -Force
            Write-Host "已删除本地 ISO，释放 $([math]::Round($size/1GB,2)) GB"
          }

      - name: 上传 R2（S3 直传，curl --aws-sigv4，无 rclone）
        if: env.DO_R2 == 'true' && env.SKIP != '1'
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_REGION: ${{ secrets.R2_REGION || 'auto' }}
        run: |
          . self/tools/cloud-upload.ps1
          Send-R2Upload -Iso "src\out\$env:ISO_BASE.iso" -Tag $env:TAG `
            -AccountId $env:R2_ACCOUNT_ID -Bucket $env:R2_BUCKET -Region $env:R2_REGION `
            -AccessKey $env:R2_ACCESS_KEY_ID -SecretKey $env:R2_SECRET_ACCESS_KEY

      - name: 上传 SharePoint（默认站点/默认文档库，Graph 证书直传 upload session，无 rclone）
        if: env.DO_ONEDRIVE == 'true' && env.SKIP != '1'
        shell: pwsh
        env:
          OD_TENANT_ID: ${{ secrets.ONEDRIVE_TENANT_ID }}
          OD_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          OD_CERT_THUMBPRINT: ${{ secrets.ONEDRIVE_CERT_THUMBPRINT }}
          OD_CERT_KEY: ${{ secrets.ONEDRIVE_CERT_KEY }}
          OD_CERT: ${{ secrets.ONEDRIVE_CERT }}
          OD_SITE_HOST: ${{ secrets.ONEDRIVE_SITE_HOST }}
        run: |
          $keyPath = "$env:RUNNER_TEMP\onedrive_key.pem"
          Set-Content -Path $keyPath -Value $env:OD_CERT_KEY -NoNewline
          $certPath = "$env:RUNNER_TEMP\onedrive_cert.pem"
          if ($env:OD_CERT) { Set-Content -Path $certPath -Value $env:OD_CERT -NoNewline }
          . self/tools/cloud-upload.ps1
          Send-SharePointUpload -Iso "src\out\$env:ISO_BASE.iso" -Tag $env:TAG `
            -TenantId $env:OD_TENANT_ID -ClientId $env:OD_CLIENT_ID `
            -CertKeyPem $keyPath -CertThumbprint $env:OD_CERT_THUMBPRINT -CertPem $certPath -SiteHost $env:OD_SITE_HOST `
            -Path $env:OD_PATH

      - name: prune Release（保留 KEEP_RELEASE 个）
        if: env.DO_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ env.KEEP_RELEASE }}
        run: |
          $keep = [int]$env:KEEP
          $edition = $env:EDITION
          # [关键] gh --jq 输出的是"未加引号的纯文本行"，不是 JSON，不能再 ConvertFrom-Json
          $raw = @(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName')
          # 降序=最新在前，Skip $keep 才能删掉"最旧的"、保留"最新的"
          $tags = @($raw | Where-Object { $_ -like "*-$edition" } | Sort-Object -Descending)
          Write-Host "现有 *-$edition 标签：$($tags.Count) 个 -> $($tags -join ', ')"
          $old = @($tags | Select-Object -Skip $keep)
          foreach ($t in $old) {
            gh release delete $t --repo "${{ github.repository }}" --yes
            gh api --method DELETE "/repos/${{ github.repository }}/git/refs/tags/$t" 2>$null
            Write-Host "pruned release $t"
          }

      - name: prune R2（保留 KEEP_R2 个，无 rclone）
        if: env.DO_R2 == 'true'
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_REGION: ${{ secrets.R2_REGION || 'auto' }}
          KEEP: ${{ env.KEEP_R2 }}
        run: |
          . self/tools/cloud-upload.ps1
          Invoke-R2Prune -AccountId $env:R2_ACCOUNT_ID -Bucket $env:R2_BUCKET -Region $env:R2_REGION `
            -AccessKey $env:R2_ACCESS_KEY_ID -SecretKey $env:R2_SECRET_ACCESS_KEY -Keep ([int]$env:KEEP) -Edition $env:EDITION

      - name: prune SharePoint（保留 KEEP_ONEDRIVE 个，无 rclone）
        if: env.DO_ONEDRIVE == 'true'
        shell: pwsh
        env:
          OD_TENANT_ID: ${{ secrets.ONEDRIVE_TENANT_ID }}
          OD_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          OD_CERT_THUMBPRINT: ${{ secrets.ONEDRIVE_CERT_THUMBPRINT }}
          OD_CERT_KEY: ${{ secrets.ONEDRIVE_CERT_KEY }}
          OD_CERT: ${{ secrets.ONEDRIVE_CERT }}
          OD_SITE_HOST: ${{ secrets.ONEDRIVE_SITE_HOST }}
          KEEP: ${{ env.KEEP_ONEDRIVE }}
        run: |
          $keyPath = "$env:RUNNER_TEMP\onedrive_key.pem"
          Set-Content -Path $keyPath -Value $env:OD_CERT_KEY -NoNewline
          $certPath = "$env:RUNNER_TEMP\onedrive_cert.pem"
          if ($env:OD_CERT) { Set-Content -Path $certPath -Value $env:OD_CERT -NoNewline }
          . self/tools/cloud-upload.ps1
          Invoke-SharePointPrune -TenantId $env:OD_TENANT_ID -ClientId $env:OD_CLIENT_ID `
            -CertKeyPem $keyPath -CertThumbprint $env:OD_CERT_THUMBPRINT -CertPem $certPath -SiteHost $env:OD_SITE_HOST `
            -Keep ([int]$env:KEEP) -Edition $env:EDITION -Path $env:OD_PATH
