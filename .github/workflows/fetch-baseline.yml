name: Fetch Baseline ISO (authoritative mirror)

# 手动触发：按 config.yml 的 baseline.sources 逐条用 aria2 多线程 HTTP 下载官方原版 ISO
#   -> SHA256 强校验 -> RAW 顺序切分（每片 <= baseline.chunk_mib，无压缩）
#   -> 生成内嵌哈希的 merge.cmd -> 上传本仓库 baseline Release。
#
# 唯一真相源：下载地址与 SHA256 全部写在 config.yml 的 baseline.sources，别处不再重复。
# 产出文件名 = URL 末段（微软原版名）；分片名、merge.cmd 键、成品 ISO 名全部由它派生。
# 各源并行下载（互相独立；串行会把两个 ISO 塞进同一个 6 小时硬上限里，必挂）。
#
# baseline Release 内容固定两样（其余残留资产会被本工作流清掉）：
#   1) <ISO 名>.part1 / .part2 / ...   RAW 字节切片，可直接 copy /b 拼回
#   2) merge.cmd                        下载方双击即自动重组 + 校验 SHA256

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # GitHub-hosted runner 硬上限 6 小时；写更大的值无效（到点仍会按执行上限取消）。
    timeout-minutes: 360
    steps:
      - name: Checkout（config.yml + assets/release/merge.cmd 模板）
        uses: actions/checkout@v4

      - name: 安装 aria2
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends aria2

      - name: 多线程下载 / 校验 / RAW 切分 / 上传 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          trap 'echo "---- 失败: $BASH_COMMAND ----"' ERR

          CHUNK_MIB="$(awk '/^baseline:/{f=1} f && /chunk_mib:/{print $2; exit}' config.yml)"
          : "${CHUNK_MIB:=1900}"
          THREADS="$(awk '/^baseline:/{f=1} f && /threads:/{print $2; exit}' config.yml)"
          : "${THREADS:=16}"
          echo "分片大小 = ${CHUNK_MIB} MiB | 并发连接 = ${THREADS}"

          # 解析 config.yml 的 baseline.sources -> TSV：branch<TAB>url<TAB>sha256
          ROWS="$(awk '
            /^[a-zA-Z]/ { inb = ($1 == "baseline:") }
            inb && /- branch:/ { if (b != "") print b "\t" u "\t" s; b = $3; u = ""; s = "" }
            inb && /^[[:space:]]+url:/    { u = $2 }
            inb && /^[[:space:]]+sha256:/ { s = $2 }
            END { if (b != "") print b "\t" u "\t" s }
          ' config.yml)"
          if [ -z "$ROWS" ]; then
            echo "ERROR: config.yml 的 baseline.sources 为空或无法解析"
            exit 1
          fi
          echo "清单条数 = $(printf '%s\n' "$ROWS" | grep -c .)"

          NOTES=$'官方 LTSC ISO 原版镜像（未改装，微软原始发行版）。\n\n分片沿用原名：<ISO 名>.part1 / .part2 / … 为 RAW 字节切片（无压缩、非 7z），顺序拼接即为原 ISO。\n\n下载后把同一分支的全部分片与 merge.cmd 放进同一目录，双击 merge.cmd 即自动重组并校验 SHA256（期望值已内嵌在 merge.cmd 中，无需另找校验文件）。'

          # 幂等：每一波上传前调用一次 —— 有则引用、无则现建。
          # 也容忍并发：多路同时现建时其中一个必然失败，视为「已被别的路建好」即可。
          ensure_release() {
            gh release view baseline --repo "$REPO" >/dev/null 2>&1 && return 0
            gh release create baseline --repo "$REPO" --title baseline --notes "$NOTES" >/dev/null 2>&1 || true
            gh release view baseline --repo "$REPO" >/dev/null 2>&1
          }

          # 单条源：多线程下载 -> SHA256 -> RAW 切分 -> 上传分片
          fetch_one() {
            local BR="$1" ISO="$2" URL="$3" SHA="$4"
            echo "=============================================================="
            echo "[$BR] 下载 -> $ISO   开始 $(date -u +%H:%M:%S)"

            # aria2 —— 轻量多线程 HTTP 下载器（apt 官方包，秒装，无编译）：
            #   -x N -s N  单服务器连接数 / 分片数（源站实测 Accept-Ranges: bytes，支持分段）
            #   -k1M       分片粒度 1 MiB
            #   -d . -o F  直接落成契约文件名，省去事后改名
            #   --file-allocation=none  不预分配，写大文件不白等
            #   --summary-interval=0    关掉周期性汇总块，只留每秒一行的读秒
            #   --auto-file-renaming=false --allow-overwrite=true  重跑时覆盖同名文件而非改名
            #
            # 必须套 stdbuf + sed -u —— 少任何一个，网页日志里就「完全没有进度」（实测过）：
            #   aria2 的读秒行走 global::cout，而 ConsoleStatCalc 只在 isTTY_ 为真时才调 flush()；
            #   CI 里 stdout 被管道接管 -> isTTY_ 假 -> 只 write 不 flush -> 落进 stdio 块缓冲，
            #   攒满 4 KiB 才吐一次。第二层缓冲在 sed：它输出到管道同样块缓冲。
            #   实测（WSL Linux + aria2 1.37.0，同参数跑 12 秒）：
            #     不加 stdbuf：12 行进度全堆在 11.99s（进程被杀退出时才 flush）→ 日志全程空白；
            #     加 stdbuf -oL -eL：1.18s / 2.17s / 3.30s … 每秒一行实时可见，且 0 个 \r。
            #   非终端分支不产生 \r，所以是一行一行往下滚，不会刷屏。
            # 断点续传：aria2 在目标旁留 .aria2 控制文件，中断后重跑同一命令即从断点继续。
            local try
            for try in 1 2 3 4 5; do
              stdbuf -oL -eL aria2c -x"$THREADS" -s"$THREADS" -k1M \
                     --file-allocation=none --summary-interval=0 \
                     --auto-file-renaming=false --allow-overwrite=true \
                     -d . -o "$ISO" "$URL" 2>&1 | sed -u "s/^/[$BR] /" && break
              echo "[$BR] 第 ${try} 次中断 $(date -u +%H:%M:%S)，5 秒后续传"
              sleep 5
            done
            if [ ! -s "$ISO" ]; then
              echo "ERROR: $BR 下载失败"
              ls -l "$ISO"* 2>/dev/null || true
              return 1
            fi

            echo "[$BR] 下载完成 $(date -u +%H:%M:%S)，$(stat -c '%s' "$ISO") bytes，开始 SHA256 校验"
            echo "$SHA  $ISO" | sha256sum -c -
            rm -f "$ISO".part* "$ISO".aria2
            split -b "${CHUNK_MIB}M" -a 1 --numeric-suffixes=1 "$ISO" "$ISO.part"
            ls -l "$ISO".part*
            ensure_release
            gh release upload baseline --repo "$REPO" --clobber "$ISO".part*
            rm -f "$ISO" "$ISO".part* "$ISO".aria2
            echo "[$BR] 完成 $(date -u +%H:%M:%S)"
          }

          # 各源并行下载
          pids=()
          while IFS=$'\t' read -r BR URL SHA; do
            [ -z "$URL" ] && continue
            BR="$(printf '%s' "$BR" | tr -d '"')"
            URL="$(printf '%s' "$URL" | tr -d '"')"
            SHA="$(printf '%s' "$SHA" | tr -d '"' | tr 'a-f' 'A-F')"
            ISO="$(basename "$URL")"
            fetch_one "$BR" "$ISO" "$URL" "$SHA" &
            pids+=($!)
          done <<< "$ROWS"

          fail=0
          for p in "${pids[@]}"; do wait "$p" || fail=1; done
          [ "$fail" -eq 0 ] || { echo "ERROR: 有源的下载/校验失败"; exit 1; }

          # merge.cmd：期望哈希逐条内嵌（纯由 config.yml 派生，与下载结果无关）
          EXP_LINES=""
          while IFS=$'\t' read -r BR URL SHA; do
            [ -z "$URL" ] && continue
            ISO="$(printf '%s' "$URL" | tr -d '"' | sed 's#.*/##')"
            SHA="$(printf '%s' "$SHA" | tr -d '"' | tr 'a-f' 'A-F')"
            EXP_LINES="${EXP_LINES}set \"EXP_${ISO}=${SHA}\""$'\n'
          done <<< "$ROWS"

          MERGE_TPL="assets/release/merge.cmd"
          mkdir -p dist
          sed -n '1,/===EXPECTED_HASHES_START===/p' "$MERGE_TPL" > dist/merge.cmd
          printf '%s' "$EXP_LINES" >> dist/merge.cmd
          sed -n '/===EXPECTED_HASHES_END===/,$p' "$MERGE_TPL" >> dist/merge.cmd
          ensure_release
          gh release upload baseline --repo "$REPO" --clobber dist/merge.cmd
          rm -rf dist

          gh release view baseline --repo "$REPO" --json assets --jq '.assets[].name' | while read -r a; do
            [ -z "$a" ] && continue
            if ! printf '%s' "$a" | grep -Eqi '\.part[0-9]+$|^merge\.cmd$'; then
              echo "清理基线残留资产: $a"
              gh release delete-asset baseline "$a" --repo "$REPO" --yes
            fi
          done

          echo "===== baseline 最终内容 ====="
          gh release view baseline --repo "$REPO" --json assets --jq '.assets[] | "\(.name)    \(.size) bytes"'
