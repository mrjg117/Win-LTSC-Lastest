name: Fetch Baseline ISO (authoritative mirror)

# 手动触发：按 config.yml 的 baseline.sources 逐条下载官方原版 ISO
#   -> SHA256 校验 -> RAW 顺序切分（每片 <= baseline.chunk_mib，无压缩）
#   -> 生成内嵌哈希的 merge.cmd -> 上传本仓库 baseline Release。
#
# 唯一真相源：下载地址与 SHA256 全部写在 config.yml 的 baseline.sources，别处不再重复。
# 文件名 = URL 末段（就是微软原版名），不另立命名规则；各源域名可不同，逐条完整写。
#
# baseline Release 内容固定两样（其余残留资产会被本工作流清掉）：
#   1) <iso 原名>.part1 / .part2 / ...   RAW 字节切片，可直接 copy /b 拼回
#   2) merge.cmd                          下载方双击即自动重组 + 校验 SHA256

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: Checkout（config.yml + merge.cmd 模板）
        uses: actions/checkout@v4

      - name: 下载 / 校验 / RAW 切分 / 上传 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          trap 'echo "---- 失败: $BASH_COMMAND ----"' ERR

          CHUNK_MIB="$(awk '/^baseline:/{f=1} f && /chunk_mib:/{print $2; exit}' config.yml)"
          : "${CHUNK_MIB:=1900}"
          echo "分片大小 = ${CHUNK_MIB} MiB"

          # 解析 config.yml 的 baseline.sources -> TSV：branch<TAB>url<TAB>sha256
          ROWS="$(awk '
            /^[a-zA-Z]/ { inb = ($1 == "baseline:") }
            inb && /- branch:/ { if (b != "") print b "\t" u "\t" s; b = $3; u = ""; s = "" }
            inb && /^[[:space:]]+url:/    { u = $2 }
            inb && /^[[:space:]]+sha256:/ { s = $2 }
            END { if (b != "") print b "\t" u "\t" s }
          ' config.yml)"
          if [ -z "$ROWS" ]; then
            echo "ERROR: config.yml 的 baseline.sources 为空或无法解析"
            exit 1
          fi
          echo "清单条数 = $(printf '%s\n' "$ROWS" | grep -c .)"

          NOTES=$'官方 LTSC ISO 原版镜像（未改装，微软原始发行版）。\n\n分片沿用微软原名：<iso 原名>.part1 / .part2 / … 为 RAW 字节切片（无压缩、非 7z），顺序拼接即为原 ISO。\n\n下载后把同一分支的全部分片与 merge.cmd 放进同一目录，双击 merge.cmd 即自动重组并校验 SHA256（期望值已内嵌在 merge.cmd 中，无需另找校验文件）。'

          # 幂等：每一波上传前调用一次 —— 有则引用、无则现建。
          # 刻意不在这里提前建：后面的下载要十几分钟，中途 release 若被删（人为清理/误删），
          # 提前建就是白建，等到上传时才发现 404。放在上传前一刻，危险窗口≈0。
          ensure_release() {
            gh release view baseline --repo "$REPO" >/dev/null 2>&1 \
              || gh release create baseline --repo "$REPO" --title baseline --notes "$NOTES"
          }

          EXP_LINES=""
          while IFS=$'\t' read -r BR URL SHA; do
            [ -z "$URL" ] && continue
            BR="$(printf '%s' "$BR" | tr -d '"')"
            SHA="$(printf '%s' "$SHA" | tr -d '"' | tr 'a-f' 'A-F')"
            ISO="$(basename "$URL")"
            echo "=============================================================="
            echo "[$BR] $ISO"
            curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$ISO" "$URL"
            echo "$SHA  $ISO" | sha256sum -c -
            rm -f "$ISO".part*
            split -b "${CHUNK_MIB}M" -a 1 --numeric-suffixes=1 "$ISO" "$ISO.part"
            ls -l "$ISO".part*
            ensure_release
            gh release upload baseline --repo "$REPO" --clobber "$ISO".part*
            rm -f "$ISO" "$ISO".part*
            EXP_LINES="${EXP_LINES}set \"EXP_${ISO}=${SHA}\""$'\n'
          done <<< "$ROWS"

          mkdir -p dist
          sed -n '1,/===EXPECTED_HASHES_START===/p' merge.cmd > dist/merge.cmd
          printf '%s' "$EXP_LINES" >> dist/merge.cmd
          sed -n '/===EXPECTED_HASHES_END===/,$p' merge.cmd >> dist/merge.cmd
          ensure_release
          gh release upload baseline --repo "$REPO" --clobber dist/merge.cmd
          rm -rf dist

          gh release view baseline --repo "$REPO" --json assets --jq '.assets[].name' | while read -r a; do
            [ -z "$a" ] && continue
            if ! printf '%s' "$a" | grep -Eq '\.iso\.part[0-9]+$|^merge\.cmd$'; then
              echo "清理基线残留资产: $a"
              gh release delete-asset baseline "$a" --repo "$REPO" --yes
            fi
          done

          echo "===== baseline 最终内容 ====="
          gh release view baseline --repo "$REPO" --json assets --jq '.assets[] | "\(.name)    \(.size) bytes"'
