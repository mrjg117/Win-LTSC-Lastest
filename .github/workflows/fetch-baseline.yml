name: Fetch Baseline ISO (authoritative mirror)

# 手动触发：从权威分发（archive.org / itellyou）拉取官方 LTSC ISO，
# 校验 SHA256（单一真相源 = config.yml 的 baseline.sha256.<分支>），
# 7z 分包（<=1.9GiB）后上传到本仓库 baseline Release。
# 命名契约：<微软原版ISO名>.7z.001 ...（build_iso.yml 按 *<isoName>.7z.* 匹配）。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "目标分支（19044=Win10 LTSC2021, 26100=Win11 LTSC2024, all=两者）"
        required: true
        default: "all"
        type: choice
        options: ["all", "19044", "26100"]
      source:
        description: "优先使用的权威分发源（auto=按列表顺序尝试）"
        required: false
        default: "auto"
        type: choice
        options: ["auto", "archive.org", "itellyou"]
      force:
        description: "即使 baseline 已有该分支分卷也重新拉取并覆盖"
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # 需要创建/上传 Release 资产

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: Checkout（读取 config.yml + baseline-sources.json）
        uses: actions/checkout@v4

      - name: 安装 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: 拉取 / 校验 / 分包 / 上传 baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_SEL: ${{ inputs.branch }}
          SRC_SEL: ${{ inputs.source }}
          FORCE: ${{ inputs.force }}
        run: python3 tools/fetch-baseline.py
