name: Fetch Baseline ISO (authoritative mirror)

# 手动触发：从唯一权威源下载两个官方 LTSC ISO -> SHA256 校验 -> RAW 顺序切分
# （每片 <= config.yml 的 baseline.chunk_mib，无压缩）-> 生成内嵌哈希的 merge.cmd
# -> 上传本仓库 baseline Release。
#
# baseline Release 的内容固定就两样，别无他物（多余资产会被本工作流清掉）：
#   1) <微软原版ISO名>.part1 / .part2 / ...    RAW 字节切片，copy /b 可直接拼回
#   2) merge.cmd                              下载方双击即自动重组 + 校验 SHA256
#
# 单一真相源：期望 SHA256 与分片大小都在 config.yml 的 baseline 段，本文件不复制。
# 唯一权威源：download.testip.xyz

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: Checkout（config.yml + merge.cmd 模板）
        uses: actions/checkout@v4

      - name: 下载 / 校验 / RAW 切分 / 上传 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          ISO10="zh-cn_windows_10_enterprise_ltsc_2021_x64_dvd_033b7312.iso"
          ISO11="zh-cn_windows_11_enterprise_ltsc_2024_x64_dvd_cff9cd2d.iso"
          SRC="https://download.testip.xyz/windows"

          CHUNK_MIB="$(grep -oP 'chunk_mib:\s*\K[0-9]+' config.yml || true)"
          : "${CHUNK_MIB:=1900}"
          echo "分片大小 = ${CHUNK_MIB} MiB"

          sha_of() {
            grep -oP "\"$1\"\s*:\s*\"\K[0-9a-fA-F]{64}" config.yml | tr '[:lower:]' '[:upper:]'
          }

          if ! gh release view baseline --repo "$REPO" >/dev/null 2>&1; then
            gh release create baseline --repo "$REPO" --title baseline \
              --notes "官方 LTSC ISO 原版镜像（RAW 切分）。把全部 .partN 与 merge.cmd 下到同一目录，双击 merge.cmd 自动重组并校验 SHA256。"
          fi

          fetch_one() {
            local iso="$1" url="$2" branch="$3"
            local exp
            exp="$(sha_of "$branch")"
            if [ -z "$exp" ]; then
              echo "ERROR: config.yml 未配置 baseline.sha256.\"$branch\""
              return 1
            fi
            echo "=============================================================="
            echo "[$branch] $iso"
            curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$iso" "$url"
            echo "$exp  $iso" | sha256sum -c -
            rm -f "$iso".part*
            split -b "${CHUNK_MIB}M" -a 1 --numeric-suffixes=1 "$iso" "$iso.part"
            ls -l "$iso".part*
            gh release upload baseline --repo "$REPO" --clobber "$iso".part*
            rm -f "$iso" "$iso".part*
          }

          fetch_one "$ISO10" "$SRC/$ISO10" 19044
          fetch_one "$ISO11" "$SRC/$ISO11" 26100

          mkdir -p dist
          sed -n '1,/===EXPECTED_HASHES_START===/p' merge.cmd > dist/merge.cmd
          printf 'set "EXP_%s=%s"\n' "$ISO10" "$(sha_of 19044)" "$ISO11" "$(sha_of 26100)" >> dist/merge.cmd
          sed -n '/===EXPECTED_HASHES_END===/,$p' merge.cmd >> dist/merge.cmd
          gh release upload baseline --repo "$REPO" --clobber dist/merge.cmd

          gh release view baseline --repo "$REPO" --json assets --jq '.assets[].name' | while read -r a; do
            [ -z "$a" ] && continue
            if ! printf '%s' "$a" | grep -Eq '\.iso\.part[0-9]+$|^merge\.cmd$'; then
              echo "清理基线残留资产: $a"
              gh release delete-asset baseline "$a" --repo "$REPO" --yes
            fi
          done

          echo "===== baseline 最终内容 ====="
          gh release view baseline --repo "$REPO" --json assets --jq '.assets[] | "\(.name)    \(.size) bytes"'
