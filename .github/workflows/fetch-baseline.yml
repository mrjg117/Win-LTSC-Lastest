name: Fetch Baseline ISO (authoritative mirror)

# 手动触发：从权威分发（archive.org / itellyou）拉取官方 LTSC ISO，
# 校验 SHA256（单一真相源 = config.yml 的 baseline.sha256.<分支>），
# RAW 顺序切分（<=1.9GiB/片，无压缩）后上传到本仓库 baseline Release。
# 命名契约：<微软原版ISO名>.part1 / .part2 / ...（build_iso.yml 按 *<isoName>.part* 匹配）。
# 同时发布 merge.cmd（内嵌各 ISO 期望哈希），下载方双击即可重组 + 校验。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "目标分支（19044=Win10 LTSC2021, 26100=Win11 LTSC2024, all=两者）"
        required: true
        default: "all"
        type: choice
        options: ["all", "19044", "26100"]
      source:
        description: "优先使用的权威分发源（auto=按列表顺序尝试）"
        required: false
        default: "auto"
        type: choice
        options: ["auto", "archive.org", "itellyou"]
      force:
        description: "即使 baseline 已有该分支分卷也重新拉取并覆盖"
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # 需要创建/上传 Release 资产

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: Checkout（读取 config.yml + baseline-sources.json + merge.cmd 模板）
        uses: actions/checkout@v4

      - name: 拉取 / 校验 / RAW 切分 / 上传 baseline（含 merge.cmd）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_SEL: ${{ inputs.branch }}
          SRC_SEL: ${{ inputs.source }}
          FORCE: ${{ inputs.force }}
        run: python3 tools/fetch-baseline.py
