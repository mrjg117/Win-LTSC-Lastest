# =============================================================================
# Win-LTSC 统一配置 —— 唯一控制面板
# 规则：全局开关/列表都写在这一个文件里；脚本只读它，别去改脚本。
#       只有"真实二进制素材"(驱动.inf、MAS脚本、应答模板)才放文件夹。
# 说明：
#   - 本文件控制：上游、baseline、全局组件/应用/驱动开关、postsetup(首启脚本)、
#     三端存储、触发策略。
#   - 每分支的"构建目标"(targetUBR / LCU / SSU / 组件精简清单)在 patchlist.json，
#     由构建引擎读取（差异化、按月更新），不要搬到这里以免两份真相源。
# =============================================================================

upstream:
  repo: adavak/Win_ISO_Patching_Scripts
  ref: master

# ---- 源镜像：下载地址 + SHA256 的唯一真相源（别处不再重复写） ----
baseline:
  chunk_mib: 1900                     # 每片上限(MiB)，留余量避开 GitHub 2GB 资产上限
  # sources：一行一条镜像。规则——
  #   * 下载文件名自动取 URL 末段（就是微软原版名），不另立命名规则；
  #   * 各源域名可不同，逐条完整写，不做域名拼接；
  #   * 产物构建份数 = 本清单条数：加一条即多产一份（该分支须在 patchlist.json 有定义）。
  sources:
    - branch: "26100"
      url: https://download.testip.xyz/windows/zh-cn_windows_11_enterprise_ltsc_2024_x64_dvd_cff9cd2d.iso
      sha256: 2CB21649590C8CF770CD93556596DFF4FD800F24D267A9BE9D9CE0EE9E03F5AC
    - branch: "19044"
      url: https://download.testip.xyz/windows/zh-cn_windows_10_enterprise_ltsc_2021_x64_dvd_033b7312.iso
      sha256: C117C5DDBC51F315C739F9321D4907FA50090BA7B48E7E9A2D173D49EF2F73A3

# ---- 组件精简：倾向开关（具体包名清单在 patchlist.json 每分支的 lean） ----
lean:
  enabled: true
  remove_xps: true
  remove_wmp_legacy: true
  keep_internet_printing: true       # 你说留着
  keep_workfolders: true             # 你说留着
  remove_ie11_win10: false           # Win10 因 Edge IE 模式依赖 MSHTML，KEEP
  keep_rds_collaboration: true       # IoT 可移除包，为安全 KEEP（远程桌面家族）
  iot_deep_cleanup: true             # IoT Removable Packages 深度精简（仅 IoT SKU）

# ---- 组件集成：写啥自动下载+集成，不限于 VC；列表项=已知别名或显式 url ----
components:
  redist:                             # Visual C++ 可再发行版(自动下载微软官方包)
    - vc14_x64
    - vc14_x86
  dotnet_runtime: false              # true 时填版本号，脚本去官方拉
  webview2: false
  directx: false
  powershell7: false

# ---- 应用预装：写任意 Microsoft Store 包族名(PackageFamilyName)即集成 ----
apps:
  store: true                        # 恢复 Microsoft Store
  paint: true                        # 画图
  notepad: true                      # 新记事本
  mediaplayer: true                  # 媒体播放器
  nanazip: false
  # 自定义：直接写包族名即可，例如：
  # - Microsoft.WindowsTerminal_8wekyb3d8bbwe
  # - Microsoft.PowerToys_8wekyb3d8bbwe

# ---- 驱动注入：开关 + 真实文件放 assets/drivers/ ----
drivers:
  inject: true                       # assets/drivers/*.inf -> install.wim(全量池)
  boot_minimal: true                 # assets/drivers/boot/*.inf -> boot.wim(最小集)

# ---- 首启脚本：每个都是 on/off 开关，调它别改脚本 ----
postsetup:
  mas: false                         # true=烤入并运行 MAS 激活(脚本放 delta/postsetup/mas/)
  disable_hibernate: true            # true=关闭休眠(powercfg -h off)
  disable_reserved_storage: false    # true=关闭预留空间(dism /Set-ReservedStorageState /Disabled)
  pagefile:
    mode: none                       # none(系统默认) | system_managed | fixed
    fixed_mb: 4096                   # mode=fixed 时生效
  wsreset: false                     # true=首启跑 wsreset -i 重注册 Store(需在线+网络)
  clean_after_run: false             # true=Run-All.ps1 跑完自清 C:\PostSetup

# ---- 产物上传 + 保留策略 ----
storage:
  release:
    enabled: true
    keep: 3                          # 保留最近 3 个同分支/同系统 Release
  r2:
    enabled: false
    keep: 1
    bucket: ""                       # 填 R2 桶名(凭证走 Secrets)
  onedrive:
    enabled: false
    keep: 2

# ---- 自动检测更新 ----
trigger:
  schedule: "0 6 * * *"              # 每日 06:00 UTC
  only_important: false              # true=仅重要(质量/月度)更新才触发构建
