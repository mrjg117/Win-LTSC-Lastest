# =============================================================================
# Win-LTSC 唯一控制面板
# -----------------------------------------------------------------------------
# 全文统一规则：写了 = 启用；注释掉 / 不写 = 停用。
#               没有 false，没有 KEEP，没有 remove_*/keep_* 成对开关。
# 只有「真实二进制素材」（驱动 .inf、应答模板、license.xml、MAS 工具包）才放文件夹。
# 地址与哈希的唯一真相源就是本文件 —— 脚本/工作流不重复写。
# =============================================================================

# ---- 源镜像：一行一条，产物份数 = 条数 ----
baseline:
  chunk_mib: 1900                     # 每片上限(MiB)，留余量避开 GitHub 2GB 资产上限
  threads: 16                         # 下载并发连接数（aria2 -x/-s）。嫌慢改 32，别处不用动。
  # sources 规则：
  #   * 文件名 = URL 末段（就是微软原版名，即契约命名）。分片名 <名>.partN、merge.cmd 的
  #     EXP_<名> 键、成品 ISO 名全部由它派生 —— URL 末段必须就是最终要的名字。
  #   * url    = 完整下载地址，逐条完整写，不做拼接（各源域名可不同）。
  #   * sha256 = 落地后强校验，不符即失败（不会把坏字节切片上传）。
  sources:
    - branch: "26100"
      url: https://download.testip.xyz/windows/zh-cn_windows_11_enterprise_ltsc_2024_x64_dvd_cff9cd2d.iso
      sha256: 2CB21649590C8CF770CD93556596DFF4FD800F24D267A9BE9D9CE0EE9E03F5AC
    - branch: "19044"
      url: https://download.testip.xyz/windows/zh-cn_windows_10_enterprise_ltsc_2021_x64_dvd_033b7312.iso
      sha256: C117C5DDBC51F315C739F9321D4907FA50090BA7B48E7E9A2D173D49EF2F73A3

# ---- 组件精简：写了就卸，注释掉 / 不写 = 保留 ----
# 这一张表对**所有分支**生效。某分支要多卸几项，写进 branches.<b>.remove，脚本合并去重。
# 名字形态由脚本自动分流；不匹配任何形态即报错退出（不静默跳过）：
#   含 ~~~~          → 按 Capability 卸载（如 XPS.Viewer~~~~0.0.1.0）
#   以 -Package 结尾  → 按 Package 卸载
#   其余             → 按 Optional Feature 关闭
remove:
  # ===== 能力（Capability，名字含 ~~~~）=====
  - XPS.Viewer~~~~0.0.1.0          # XPS 文档查看器
  - App.StepsRecorder~~~~0.0.1.0   # 步骤记录器（psr.exe）
  - QuickAssist~~~~0.0.1.0         # 快速助手（远程协助）
  # ===== 包（Package，以 -Package 结尾）=====
  - Microsoft-Windows-CameraBarcodeScanner-Package   # 相机条码扫描器
  - Microsoft-Windows-USBFunction-Package            # USB 设备（MTP）功能角色
  - Microsoft-Windows-NetworkMobileHandlers-Package   # 移动网络（手机网络）处理
  - Microsoft-Windows-DesktopFileExplorer-Package     # ⚠ 桌面文件资源管理器：删后仅剩 UWP 管理器，原配置即如此，慎用
  - Microsoft-Windows-UEV-Package                    # 用户体验虚拟化（UE-V）
  - Microsoft-Windows-LegacyWordbreaker-Package       # 旧版断字（西文排版）
  - Microsoft-Windows-BootEnvironment-Dvd-Package     # 从 DVD 启动的引导环境
  - Microsoft-Windows-3DAudio-HRTFData-Package        # 3D 音频 HRTF 数据

# ---- 每分支构建目标 ----
branches:
  "26100":
    label: Win11-LTSC-2024            # → 产物标签 <YYMMDD>-<UBR>-Win11
    edition: IoTEnterpriseS           # 构建时 Dism /Set-Edition 到此 SKU（密钥查下方 gvlk 表）
    family: [26100, 26200, 26300]     # 允许的 build 家族（上游可能装"版本启用包"，build 会跳）
    # detect：check-updates 用它去 Update Catalog 搜「微软为本产品最新发了什么」。
    #   刻意用产品名而不是 build 号 —— 按 build 号搜会把 Server 版同名 build 混进来
    #   （实测 26100 那页里 Server 是 26100.33451，真客户端是 26100.9457）。
    detect: Windows 11, version 24H2
    # remove:                         # 本分支额外卸（与上方全局 remove 合并）。不写 = 只吃全局表
    #   [别加 Media.Playback~~~~0.0.1.0] 它看着像"WMP 开关"，实际是整个 Media Feature Pack：
    #   WMP + Media Foundation + 全套音视频编解码（MPEG / WMA / AAC / FLAC / AC-3…）+ WPD 便携设备。
    #   卸掉它，Edge / 照片 / Teams / 摄像头 / 语音输入会一并坏掉；WMP 本体由独立的系统
    #   removable package `Microsoft-Windows-MediaPlayback-OC`（Package Size 0 KB 的纯开关）管理。
    apps:                             # 本分支专属应用（与全局 apps 合并去重；两分支都装的放全局）
      # 其余一律不再预置商店包 —— 这几项改用「系统自带老组件 + 免安装工具」：
      #   画图 / 记事本 —— LTSC 出厂自带经典版（mspaint.exe / notepad.exe），不用补；
      #     商店版是 AI 重型包（Paint bundle 722 MB，其中 330 MB 是 .onnxe 模型权重）
      #   播放器 —— components 段的 MPC-BE（自带全解码、HDR/DV，比 WMP+解码包更小更好）
      #   解压   —— 全局 apps 段的 NanaZip（MSIX 正常应用，按 Store 流程预置）
  "19044":
    label: Win10-LTSC-2021
    edition: IoTEnterpriseS
    family: [19041, 19042, 19043, 19044, 19045]
    # detect：同上。Win10 的 Catalog 结果里没有 build 号（Version 列是 n/a），
    #   所以只能按产品名认，比较"最新一次的发布日期"而不是 build 号。
    detect: Windows 10 Version 21H2
    remove:
      - MicrosoftWindowsPowerShellV2
      - MicrosoftWindowsPowerShellV2Root
    # 应用与全局 apps 合并去重，写法与 26100 分支相同。
    apps:
      # [实测推翻旧结论] 曾以为"新版 MSIX 的 MinVersion 钉 Windows 11，Win10 装不上"。
      #   实测现行包 Microsoft.WindowsStore_22608.1401.3.0 的 TargetDeviceFamily：
      #     MinVersion = 10.0.18362.0（Win10 1903）、MaxVersionTested = 10.0.26100.0
      #   19044 > 18362，满足 —— 两个分支共用同一产品 ID 即可。
      #   同一产品 ID 下另有旧线 11811.1001.2713.0 / 12107.1001.15.0（appxbundle 形态，
      #   MinVersion 10.0.14393 / 10.0.16299）；只有在新包被下架时才需要回退到它们。

# ---- SKU 转换用的 KMS GVLK（微软官方文档所列，一般不用改）----
gvlk:
  IoTEnterpriseS: KBN8V-HFGQ4-MGXVD-347P6-PDQGT   # Windows IoT Enterprise LTSC 2024 / 2021 通用
  EnterpriseS:    M7XTQ-FN8P6-TTKYV-9D4CC-J462D   # Windows 11 / 10 Enterprise LTSC（备用）

# ---- 优化 / 组件：全在本段，写了就生效；注释 / 不写 = 不做 ----
# 三个子键，各对应一种落地方式（执行器不同）：
#   ini        上游 W10UI.ini 开关名 → 99 把该键置 1 写回上游 ini（上游自己注入镜像）
#   registry   离线 hive 注册表写入 → 07 挂载镜像时 reg load → 按表写 → unload
#   components 桌面向导组件安装器   → 07 写进 unattend，首次开机静默装到官方默认目录
#
# registry 的值格式（竖线分隔，五段）：
#     hive|path|name|type|value
#   hive   SYSTEM / SOFTWARE / DEFAULT（DEFAULT = Users\Default\NTUSER.DAT）
#   path   注册表路径；{CS} = 该 hive 里所有 ControlSetNNN
#          （离线 hive 没有 CurrentControlSet，那是运行时符号链接，必须写 ControlSetNNN）
#   name   值名；留空 = 该键的默认值
#   type   DWORD / SZ / EXPAND_SZ
#   value  值；DWORD 写数字，其余直接写
#   路径/值里其它的花括号（CLSID、{FFE2A43C-…}）是路径本身的一部分，不是占位符。
#
# 一个开关要写多条时，写成列表：
#     name:
#       - "第一条"
#       - "第二条"
# 含 {ext} 的行 = 展开型：对下方 _extensions 里的每个扩展名各写一次
# （photo_viewer_legacy 靠它把 13 个扩展名关联一行写完，不用手抄 13 行）。
optimize:

  # ===== 上游 W10UI 开关（行为由上游实现，我们只置 1）=====
  ini:
    nosuggapp:  禁第三方应用静默安装
    nosuggtip:  禁「建议 / Spotlight / 锁屏聚焦 / 搜索框推荐」
    norestorage: 关预留存储
    nogamebar:  关 Xbox Game Bar
    oobebypass: OOBE 免联网建本地账户
    UpdtBootFiles: 更新 ISO 引导文件 + UEFI CA 2023 新安全启动证书（旧 CA 2026-06 已到期）

  # ===== 离线 hive 注册表写入（构建期写进镜像，装完即生效）=====
  # --- 电源与性能 ---
  registry:
    disable_hibernate:    "SYSTEM|{CS}\\Control\\Power|HibernateEnabled|DWORD|0"                    # 关休眠
    disable_faststartup:  "SYSTEM|{CS}\\Control\\Session Manager\\Power|HiberbootEnabled|DWORD|0"   # 关快速启动

    # --- 隐私（Policies 路径 = 硬锁，用户改不回去）---
    disable_telemetry:    "SOFTWARE|Policies\\Microsoft\\Windows\\DataCollection|AllowTelemetry|DWORD|0"                    # 关遥测
    no_consumer_features: "SOFTWARE|Policies\\Microsoft\\Windows\\CloudContent|DisableWindowsConsumerFeatures|DWORD|1"     # 关消费者体验
    no_spotlight:         "SOFTWARE|Policies\\Microsoft\\Windows\\CloudContent|DisableWindowsSpotlightFeatures|DWORD|1"    # 关 Windows 聚焦
    no_advertising_id:    "SOFTWARE|Policies\\Microsoft\\Windows\\AdvertisingInfo|DisabledByGroupPolicy|DWORD|1"           # 关广告 ID
    no_feedback:          "SOFTWARE|Policies\\Microsoft\\Windows\\DataCollection|DoNotShowFeedbackNotifications|DWORD|1"   # 关反馈通知

    # --- 界面（默认用户 hive = 软默认，用户可自己改回）---
    show_file_extensions: "DEFAULT|Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced|HideFileExt|DWORD|0"   # 显示文件扩展名
    show_hidden_files:    "DEFAULT|Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced|Hidden|DWORD|1"        # 显示隐藏文件
    taskbar_align_left:   "DEFAULT|Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced|TaskbarAl|DWORD|0"    # Win11 任务栏左对齐
    classic_context_menu: "DEFAULT|Software\\Classes\\CLSID\\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\\InprocServer32||SZ|"  # Win11 经典右键菜单
    numlock_on:           "DEFAULT|Control Panel\\Keyboard|InitialKeyboardIndicators|SZ|2"                                # 小键盘开机默认亮

    # --- 安全与兼容 ---
    no_bitlocker_auto:     "SYSTEM|{CS}\\Control\\BitLocker|PreventDeviceEncryption|DWORD|1"        # 禁 BitLocker 自动加密
    allow_all_trusted_apps: "SOFTWARE|Policies\\Microsoft\\Windows\\Appx|AllowAllTrustedApps|DWORD|1"  # 允许预置非 Store 签名包（配合 apps 的 /SkipLicense，必须开）

    # --- 老组件回补 ---
    # 让经典「Windows 照片查看器」可用（LTSC 不带现代照片应用；PhotoViewer.dll 一直在系统里，
    # 缺的只是两处 shell 注册）。补完它才会出现在「打开方式」列表里 —— 真正设为默认仍需用户
    # 自己点一下，因为 UserChoice 带哈希保护，离线写不了。
    # 值与实测的本机 Win11 24H2 注册表逐字一致；ProgID 一律用 PhotoViewer.FileAssoc.Tiff
    # （实测 Win10/11 上其余 ProgID 已被移除，只剩这一个还是完整的树）。
    photo_viewer_legacy:
      - "SOFTWARE|Classes\\Applications\\photoviewer.dll\\shell\\open|MuiVerb|SZ|@%ProgramFiles%\\Windows Photo Viewer\\photoviewer.dll,-3043"
      - "SOFTWARE|Classes\\Applications\\photoviewer.dll\\shell\\open\\command||EXPAND_SZ|%SystemRoot%\\System32\\rundll32.exe \"%ProgramFiles%\\Windows Photo Viewer\\PhotoViewer.dll\", ImageView_Fullscreen %1"
      - "SOFTWARE|Classes\\Applications\\photoviewer.dll\\shell\\open\\DropTarget|Clsid|SZ|{FFE2A43C-56B9-4bf5-9A79-CC6D4285608A}"
      - "SOFTWARE|Microsoft\\Windows Photo Viewer\\Capabilities|ApplicationName|EXPAND_SZ|@%ProgramFiles%\\Windows Photo Viewer\\PhotoViewer.dll,-3058"
      - "SOFTWARE|Microsoft\\Windows Photo Viewer\\Capabilities\\FileAssociations|{ext}|SZ|PhotoViewer.FileAssoc.Tiff"

  # 展开型条目的取值清单（只在 registry 里出现 {ext} 时才用得到）
  _extensions:
    - .bmp
    - .dib
    - .gif
    - .ico
    - .jfif
    - .jpe
    - .jpeg
    - .jpg
    - .jxr
    - .png
    - .tif
    - .tiff
    - .wdp

  # ===== 组件：名字: 链接。写了 = 构建期下载，首次开机静默装 =====
  # 说明：DISM /Add-Package 只接受 .cab/.msu，而这些都是 NSIS/Inno 安装器 —— 没有任何官方途径
  #       在构建期直接写进镜像内部。官方可行落点是「部署后静默安装」：这里写进镜像里的
  #       unattend.xml（synthesize pass），首次开机由 Windows 自己装一遍，跑完自删。
  #       得到的是正常安装：装到官方默认目录（C:\Program Files\…）、可卸载、有「应用和功能」条目。
  # 装法与参数由安装器类型自动判定，判不出即报错（绝不猜，猜错会弹出图形向导而不报错）：
  #   .msi                  → msiexec /i "<文件>" /qn /norestart
  #   .exe (Inno)           → /VERYSILENT /SP- /SUPPRESSMSGBOXES /NORESTART
  #   .exe (NSIS)           → /S
  #   .exe (vc_redist/vc14) → /install /quiet /norestart
  #   .exe (vcredist/2010)  → /q /norestart
  #   .exe (dotnet 运行时)   → /install /quiet /norestart
  #   .exe (directx Jun2010) → 先 /Q /C /T: 解出 DXSETUP.exe，再 DXSETUP.exe /silent /norestart
  #   .zip                  → 内含唯一安装器时自动解出内层 .exe/.msi；其余形态报错
  # 路径与设置一律走官方默认（不传 /DIR、不传 INSTALLDIR、不动组件勾选）：
  #   MPC-BE (x64 安装器) → C:\Program Files\MPC-BE x64 （官方 iss 的 DefaultDirName={pf}\MPC-BE x64）
  #   NDM    (Inno 5.5.7) → C:\Program Files (x86)\Neat Download Manager（官方安装器默认，实测确认）
  #   运行库（VC++ / .NET / DX）均装到系统默认目录（%SystemRoot%\System32 / Program Files），无需指定
  components:
    # —— 共享运行库（多个组件 / 程序共用，首次开机静默装到系统目录）——
    vc14_x64:       https://aka.ms/vs/17/release/vc_redist.x64.exe     # VC++ 2015-2022 x64（MPC-BE 等 C++ 程序共用）
    vc14_x86:       https://aka.ms/vs/17/release/vc_redist.x86.exe     # VC++ 2015-2022 x86
    # 注：微软原 download.microsoft.com 下载中心已整体退役（2026 实测 404）。以下 VC++2010 / DirectX
    #     改走 Internet Archive 存档的官方原版二进制（字节级即微软发布件，权威可信）。
    vcredist_x64:   https://archive.org/download/vcredist_2010/vcredist_x64.exe  # VC++ 2010 x64（老组件 / 老游戏；IA 存档官方原版）
    vcredist_x86:   https://archive.org/download/vcredist_2010/vcredist_x86.exe  # VC++ 2010 x86（IA 存档官方原版）
    dxruntime:      https://archive.org/download/directx_Jun2010_redist.exe/directx_Jun2010_redist.exe  # DirectX 最终用户运行时（Jun2010，补老游戏 D3DX9 / XInput / XAudio；IA 存档）
    dotnet9_desktop: https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/9.0.18/windowsdesktop-runtime-9.0.18-win-x64.exe  # .NET 9 Desktop Runtime（含 .NET Runtime，WPF/WinForms 程序）
    # —— 桌面应用安装器 ——
    mpcbe:    https://github.com/Aleksoid1978/MPC-BE/releases/download/1.9.1/MPC-BE.1.9.1.x64-installer.zip   # MPC-BE 播放器
    ndm:      https://www.neatdownloadmanager.com/file/NeatDM_setup.exe   # Neat Download Manager
    # dotnet8: https://...
    #
    # 汉化覆盖（可选，通用规则）：把要替换的文件放到 delta/assets/overwrite/<组件名>/ 下即生效 ——
    #   目录名必须是上面 components 里的名字，目录内保持「相对安装目录」的结构，例如：
    #     delta/assets/overwrite/ndm/NeatDM.exe                  → 覆盖 <安装目录>\NeatDM.exe
    #     delta/assets/overwrite/ndm/Languages/zh-CN.ini          → 覆盖 <安装目录>\Languages\zh-CN.ini
    #   构建期这些文件被打进 C:\Tools\install\ow_<组件名>\，首次开机装完该组件后由 unattend 里
    #   追加的 copy 命令覆盖过去（纯文件复制，不需要任何脚本 / Python）。
    #   覆盖目标 = 该组件的官方默认安装目录（目前已登记：ndm / mpcbe），未登记的组件直接报错。
    #   NDM 汉化成品来源需自行确认：exe 汉化必然破签名，无法验证完整性，故本仓库不内置该文件。
    #   实测可用的成品：github.com/wmwlwmwl/NeatDM-CN 的 out/NeatDM.exe（对应官方 1.4.24）

# ---- 预装应用：写一行装一个；注释 / 不写 = 不装 ----
# 与上方 remove 同一套规则：**全局表对所有分支生效**，某分支专属的写进 branches.<b>.apps，
# 脚本合并去重。本文件没有「排除」语法 —— 全局写了就是所有分支都装，
# 所以「只有 Win11 装得了」的包必须写在 26100 分支下，不要放全局。
# 值的形态，脚本自动分流（不匹配任何形态即报错，不静默跳过）：
#   Store 产品 ID（12 位字母数字） → 构建期换算成微软官方 CDN 直链后下载（含依赖框架）
#   完整直链（含 ://）             → 直接下载
# 选包规则（同一产品 ID 常返回多个候选）：
#   架构优先 x64 / neutral（arm 系一律丢弃），再取包名里版本号最大的那个 —— 刻意不按体积排，
#   体积排序会选中旧版（实测 Media Player 会选到 2019 年的包而非现行 11.2607.16.0）。
#   加密包（.eappxbundle / .emsixbundle）无法离线预置，脚本按扩展名排除。
# license：同名 .xml 放在对应载荷目录就带上；没有则 /SkipLicense。
#          /SkipLicense 预置非 Store 来源的包时，必须同时启用 optimize 里的
#          allow_all_trusted_apps，否则用户首次登录注册会失败、应用打不开。
apps:
  # 全分支通用应用（写这里 = 两分支都装，脚本合并去重）
  - 9WZDNCRFJBMP                  # Microsoft Store（LTSC 出厂不带；两分支共用同一产品 ID，故放全局一次）
  - https://github.com/M2Team/NanaZip/releases/download/7.0.1843.0/NanaZip_7.0.1843.0.msixbundle  # NanaZip 7.0 文件管理器（替代 7-Zip；license.xml 由抓取脚本按同名自动配对）

# ---- 上传：值 = 保留份数；注释 / 不写 = 不上传 ----
storage:
  release: 3
  # r2: 1
  # onedrive: 2
